[project]
name = "voxledger-transcripts"
version = "3.4.1"
description = "VoxLedger earnings-call transcript ingestion and normalization backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "SQLAlchemy==2.0.54",
    "PyMySQL==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-PyMySQL==1.2.0.20260923",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxledger"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "stubs"
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "stubs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
