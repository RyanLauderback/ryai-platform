name: Droid Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: droid-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Droid
        uses: Factory-AI/droid-action@latest
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_security_review: true
